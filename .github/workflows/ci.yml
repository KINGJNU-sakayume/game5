name: CI & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 타입 검사 · 단위 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 테스트 (모든 게임 자동 플레이 = 100점 검증)
        run: npm test
      - name: 빌드
        run: npm run build
      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-starland-dist
          path: dist
          retention-days: 14

  e2e:
    name: E2E 테스트 (iPhone 15 Pro 화면)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 빌드
        run: npm run build
      - name: E2E 실행 (393x852 @3x 전체 화면 + Safari 툴바 화면)
        run: npx playwright test
      - name: 스크린샷/리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            test-results
            playwright-report
          retention-days: 14

  e2e-webkit:
    name: E2E 테스트 (WebKit = Safari 엔진)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright WebKit 설치
        run: npx playwright install --with-deps webkit
      - name: 빌드
        run: npm run build
      - name: E2E 실행 (WebKit, 393x852 @3x)
        run: npx playwright test
        env:
          PW_WEBKIT: '1'
      - name: 스크린샷/리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-screenshots
          path: |
            test-results
            playwright-report
          retention-days: 14

  deploy:
    name: GitHub Pages 배포
    needs: [test, e2e, e2e-webkit]
    # 기본 브랜치에 push 하거나 수동 실행했을 때만 배포
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pages 설정 확인
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages가 꺼져 있으면 안내
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages 설정 필요::아직 배포되지 않았어요. 저장소 Settings → Pages → Build and deployment → Source 를 'GitHub Actions' 로 바꾼 뒤 이 워크플로를 다시 실행(Re-run)하면 배포됩니다."
          {
            echo "### ⚠️ GitHub Pages 설정이 필요해요 (테스트는 모두 통과)"
            echo ""
            echo "1. 저장소 **Settings → Pages** 로 이동"
            echo "2. **Build and deployment → Source** 를 **GitHub Actions** 로 선택"
            echo "3. Actions 탭에서 이 워크플로를 **Re-run all jobs** 하면 배포됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pages 아티팩트 업로드
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 배포
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 배포 주소 안내
        if: steps.pages.outcome == 'success'
        run: |
          {
            echo "### 🎮 리듬 별나라 배포 완료!"
            echo ""
            echo "플레이 주소: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "아이폰 Safari에서 열고 **공유 → 홈 화면에 추가** 하면 전체 화면으로 즐길 수 있어요."
          } >> "$GITHUB_STEP_SUMMARY"
