<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="리듬 별나라" />
    <meta name="application-name" content="리듬 별나라" />
    <meta name="theme-color" content="#1b0f3d" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="박자에 맞춰 탭! 아이폰 화면에 꽉 차는 리듬 게임 '리듬 별나라'" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- iPhone 15 Pro / 15 / 14 Pro (393 x 852 @3x) 시작 화면 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./splash/splash-1179x2556.png"
    />
    <!-- iPhone 15 Pro Max / 15 Plus (430 x 932 @3x) -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./splash/splash-1290x2796.png"
    />
    <title>리듬 별나라</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120a2a;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        touch-action: none;
        outline: none;
      }
      #safe {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        visibility: hidden;
        pointer-events: none;
      }
      noscript {
        color: #fff;
        font-family: sans-serif;
        display: block;
        padding: 40px 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="리듬 별나라 게임 화면"></canvas>
    <div id="safe"></div>
    <noscript>리듬 별나라를 플레이하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
